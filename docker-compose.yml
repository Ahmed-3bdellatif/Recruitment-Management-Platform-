services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rmp-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ldap
      DB_URL: "jdbc:sqlserver://mssql:1433;databaseName=RecruitmentManagementPlatform;encrypt=true;trustServerCertificate=true;createDatabaseIfNotExist=true"
      DB_USERNAME: sa
      DB_PASSWORD: "YourStrong@Passw0rd"
      LDAP_URL: "ldap://openldap:389"
      LDAP_BASE: "dc=example,dc=com"
      LDAP_MANAGER_DN: "cn=admin,dc=example,dc=com"
      LDAP_MANAGER_PASSWORD: "admin"
      JWT_SECRET: "development-secret-that-is-at-least-32-chars-long-rmp"
      JWT_EXPIRATION: "86400000"
      APP_ADMIN_EMAIL: "admin@example.com"
      APP_ADMIN_PASSWORD: "Admin@12345"
      CV_PARSER_AI_ENABLED: "${CV_PARSER_AI_ENABLED:-false}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
    depends_on:
      mssql:
        condition: service_healthy
      openldap:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads
    networks:
      - rmp-network

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rmp-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - rmp-network

  openldap:
    image: osixia/openldap:1.5.0
    container_name: rmp-openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "Example"
      LDAP_DOMAIN: "example.com"
      LDAP_BASE_DN: "dc=example,dc=com"
      LDAP_ADMIN_PASSWORD: "admin"
    ports:
      - "8389:389"
    volumes:
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:389", "-b", "dc=example,dc=com", "-s", "base"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rmp-network

networks:
  rmp-network:
    driver: bridge

volumes:
  mssql-data:
  app-uploads:
