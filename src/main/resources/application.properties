spring.application.name=Recruitment Management Platform
spring.profiles.active=ldap

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RecruitmentManagementPlatform;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-random-value-32-chars}
security.jwt.expiration=${JWT_EXPIRATION:900000}

app.admin.email=admin@example.com
app.admin.password=Admin@12345

app.upload.base-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

app.cv-parser.ai.enabled=${CV_PARSER_AI_ENABLED:false}
app.cv-parser.gemini.api-key=${GEMINI_API_KEY:}
app.cv-parser.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

